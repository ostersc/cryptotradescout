# Server configuration
server.port=5000
server.address=0.0.0.0

# Logging Configuration
logging.level.root=INFO
#logging.level.com.crypto.trading=DEBUG
#logging.level.com.crypto.trading.exchange=DEBUG
#logging.level.com.crypto.trading.algorithm=DEBUG
#logging.level.com.crypto.trading.backtest=DEBUG
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n


# Database configuration
spring.datasource.url=jdbc:h2:mem:tradingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Initialize schema
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.mode=always

# Security configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Application authentication configuration
app.auth.allowed-emails=ostersc@gmail.com
#app.auth.allowed-domains=yourdomain.com

# OpenAPI documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging configuration
logging.level.root=INFO
logging.level.com.crypto.trading=DEBUG
logging.level.org.springframework.security=INFO

# Exchange API configuration
exchange.kraken.api.key=${KRAKEN_API_KEY:demo-key}
exchange.kraken.api.secret=${KRAKEN_API_SECRET:demo-secret}
exchange.kraken.api.url=https://api.kraken.com
exchange.coinbase.api.key=${COINBASE_API_KEY:demo-key}
exchange.coinbase.api.secret=${COINBASE_API_SECRET:demo-secret}
exchange.coinbase.api.passphrase=${COINBASE_API_PASSPHRASE:demo-passphrase}
exchange.coinbase.api.url=https://api.exchange.coinbase.com
exchange.default=kraken

# Trading Configuration
trading.default-exchange=Kraken
trading.default-algorithm=simple-moving-average
trading.default-trading-pair=BTC-USD
trading.security.enabled=false

# Data Retention
trading.data.market-data-days-to-keep=30
trading.data.orders-days-to-keep=365

# OpenAI configuration
openai.api.key=${OPENAI_API_KEY:your-openai-api-key}
openai.api.model=gpt-4o-mini

# API client retry configuration
api.retry.max-attempts=3
api.retry.delay.initial-ms=1000
api.retry.delay.multiplier=2.0

# Email notification configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:noreply@example.com}
spring.mail.password=${EMAIL_PASSWORD:dummypassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notification.email.enabled=false
notification.email.from=noreply@example.com