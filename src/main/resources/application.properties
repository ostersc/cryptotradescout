# Server Configuration
server.port=5000
server.address=0.0.0.0

# Spring Application Name
spring.application.name=crypto-trading-system

# Logging Configuration
logging.level.root=INFO
logging.level.com.crypto.trading=DEBUG
logging.level.com.crypto.trading.exchange=DEBUG
logging.level.com.crypto.trading.algorithm=DEBUG
logging.level.com.crypto.trading.backtest=DEBUG
logging.level.org.springframework.web.reactive.function.client=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:tradingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Initialize schema
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.mode=always

# Exchange API Configuration
# Please replace these with actual API keys and secrets in production
exchange.kraken.api.url=https://api.kraken.com
exchange.kraken.api.key=${KRAKEN_API_KEY:}
exchange.kraken.api.secret=${KRAKEN_API_SECRET:}

exchange.coinbase.api.url=https://api.exchange.coinbase.com
exchange.coinbase.api.key=${COINBASE_API_KEY:}
exchange.coinbase.api.secret=${COINBASE_API_SECRET:}
exchange.coinbase.api.passphrase=${COINBASE_API_PASSPHRASE:}

# Trading Configuration
trading.default-exchange=Kraken
trading.default-algorithm=simple-moving-average
trading.default-trading-pair=BTC-USD
trading.security.enabled=false

# Scheduler Configuration
trading.scheduler.enabled=false
trading.scheduler.interval=60000

# Notification Configuration
notification.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
notification.email.from=${EMAIL_FROM:crypto-trading@example.com}
notification.email.to=${EMAIL_TO:user@example.com}

# Email Configuration (JavaMailSender)
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Data Retention
trading.data.market-data-days-to-keep=30
trading.data.orders-days-to-keep=365

# OpenAI Configuration for AI Advisor
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=gpt-4o-mini
