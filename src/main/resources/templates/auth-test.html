<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test - Crypto Trading Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h2>Authentication Status</h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${#authentication != null && #authentication.isAuthenticated() && !#strings.equals(#authentication.getPrincipal(), 'anonymousUser')}" class="alert alert-success">
                            <h4>You are authenticated!</h4>
                            <p>Username: <span th:text="${#authentication.name}">username</span></p>
                            <p>Authorities: <span th:text="${#authentication.authorities}">authorities</span></p>
                        </div>
                        <div th:unless="${#authentication != null && #authentication.isAuthenticated() && !#strings.equals(#authentication.getPrincipal(), 'anonymousUser')}" class="alert alert-warning">
                            <h4>You are not authenticated</h4>
                            <p>Please log in to access secured features.</p>
                        </div>
                        <div class="mt-3">
                            <a href="/" class="btn btn-primary">Back to Home</a>
                            <a href="/login" class="btn btn-success">Login Page</a>
                            <a th:if="${#authentication != null && #authentication.isAuthenticated() && !#strings.equals(#authentication.getPrincipal(), 'anonymousUser')}" href="/logout" class="btn btn-danger">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
