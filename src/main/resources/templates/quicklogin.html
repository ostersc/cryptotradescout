<!DOCTYPE html>
<html>
<head>
    <title>Quick Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .login-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .login-button {
            display: inline-block;
            background-color: #4285f4;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin: 10px 0;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Crypto Trading Platform</h1>
        <p>Click the button below to login instantly:</p>
        
        <a href="/auth/dev-login" class="login-button">One-Click Login</a>
        
        <p><small>This is a simplified login for development purposes</small></p>
    </div>
</body>
</html>
