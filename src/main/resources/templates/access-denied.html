<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Crypto Trading Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content-container {
            max-width: 600px;
            padding: 2rem;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .icon-large {
            font-size: 5rem;
            color: #dc3545;
            margin-bottom: 1rem;
        }
        .btn-back {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="content-container">
        <div class="icon-large">
            <i class="bi bi-shield-lock"></i>
            ⛔
        </div>
        <h1 class="mb-4">Access Denied</h1>
        <div class="alert alert-danger mb-4">
            <p>You don't have permission to access this resource.</p>
        </div>
        
        <div class="mb-4">
            <p>Possible reasons:</p>
            <ul class="list-group mb-3">
                <li class="list-group-item">You need to use two-factor authentication</li>
                <li class="list-group-item">Your email address is not authorized for this application</li>
                <li class="list-group-item">Your domain is not in the allowed domains list</li>
            </ul>
        </div>
        
        <div class="d-grid gap-2">
            <a href="/logout" class="btn btn-primary">Sign Out and Try Again</a>
            <a href="/" class="btn btn-outline-secondary">Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
